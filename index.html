<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Для тебя ❤️</title>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
    <!-- Конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffe6e6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: #4a4a4a;
            padding: 16px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: visible;
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            margin: 0 auto;
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 16px;
            font-weight: 600;
            color: #555;
            line-height: 1.4;
        }

        .photo-container {
            width: 100%;
            margin-bottom: 16px;
        }
        
        .photo-container img {
            width: 100%;
            height: auto;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            display: block;
            border-radius: 16px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 8px 0 8px 0;
        }

        .btn {
            background: #fff0f3;
            border: 2px solid #ffccd5;
            color: #ff4d6d;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            width: 100%;
        }

        .btn:hover {
            background: #ff4d6d;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .reaction-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
        }

        .reaction-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .reaction-text {
            font-size: 1.3rem;
            margin: 20px 0 30px 0;
            line-height: 1.5;
            color: #333;
            max-width: 400px;
        }

        .next-btn {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }

        .final-screen {
            text-align: center;
            padding: 10px 0;
        }

        .final-screen h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d6d;
            font-size: 2.5rem;
            margin: 15px 0 20px 0;
        }

        .final-screen p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .final-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 16px 35px;
            border-radius: 50px;
            font-size: 1.3rem;
            cursor: pointer;
            margin: 15px 0;
            animation: pulse 2s infinite;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(46, 204, 113, 0.5);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        #bonus-message {
            margin-top: 20px;
            color: #555;
            animation: fadeIn 0.5s;
            font-size: 1.1rem;
            background: #f0f0f0;
            padding: 15px;
            border-radius: 15px;
        }

        @keyframes fadeIn { 
            from { opacity: 0; } 
            to { opacity: 1; } 
        }

        .photo-row {
            width: 100%;
        }
    </style>
</head>
<body>

<!-- КОНТЕЙНЕР ДЛЯ ВОПРОСОВ -->
<div class="container" id="quiz-container">
    <div class="photo-row" id="photo-row">
        <!-- ФОТО ДЛЯ ВОПРОСА -->
    </div>
    <h2 id="question-text">Загрузка...</h2>
    <div class="options" id="options-container">
        <!-- Кнопки -->
    </div>

    <!-- МОДАЛКА С ФОТО -->
    <div class="reaction-modal" id="reaction-modal">
        <div class="photo-container" id="reaction-photo-container">
            <!-- ФОТО ДЛЯ РЕАКЦИИ -->
        </div>
        <p class="reaction-text" id="reaction-message"></p>
        <button class="next-btn" onclick="nextQuestion()">Дальше ➜</button>
    </div>
</div>

<!-- ФИНАЛЬНЫЙ ЭКРАН -->
<div class="container hidden" id="final-container">
    <div class="final-screen">
        <div class="photo-container">
            <img src="" alt="фото" id="final-photo">
        </div>
        <h1>С 8 Марта! 🌷</h1>
        <p>Спасибо что ответила вопросы 😘:</p>
        <p style="font-size: 1.5rem; color: #ff4d6d; font-weight: bold;">Ты — самая лучшая!</p>
        <button class="final-btn" onclick="finishQuiz()">Нажми, если улыбнулась</button>
        <div id="bonus-message" class="hidden">
            <p>🎁 <b>Бонус:</b> Как вернешься в город, приглашаю тебя на ужин.</p>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // НАСТРОЙКИ (ЗАПОЛНИ ЭТО ПЕРЕД ЗАГРУЗКОЙ!)
    // ==========================================
    
    // 1. Токен твоего бота от BotFather
    const TELEGRAM_BOT_TOKEN = '8797961566:AAHuRDWTf05o6PllqtA2srjntYCPhmEL5y0'; 
    
    // 2. Твой ID чата (от userinfobot)
    const TELEGRAM_CHAT_ID = '211978203'; 

    // 3. Правильный цвет глаз (для логики первого вопроса)
    const CORRECT_EYE_COLOR = "Голубые"; 

    // ==================== 🍂 ВСЕ ФОТО ДЛЯ САЙТА ====================
    // Порядок: В1 → Р1 → В2 → Р2 → В3 → Р3 → В4 → Р4 → В5 → Р5 → ФИНАЛ
    const PHOTO_URLS = [
        'https://static.tildacdn.com/tild3833-3961-4662-b133-643830313438/1772958595669-w5m84s.jpg',  // Вопрос 1
        'ССЫЛКА_НА_ФОТО_2',  // Реакция на вопрос 1
        'https://static.tildacdn.com/tild3231-3637-4234-a537-623964373535/1772958371428-uus4wj.jpg',  // Вопрос 2
        'ССЫЛКА_НА_ФОТО_4',  // Реакция на вопрос 2
        'https://static.tildacdn.com/tild3535-3638-4431-a635-663033383061/2025-09-25_01-29-01.JPG',  // Вопрос 3
        'ССЫЛКА_НА_ФОТО_6',  // Реакция на вопрос 3
        'ССЫЛКА_НА_ФОТО_7',  // Вопрос 4
        'ССЫЛКА_НА_ФОТО_8',  // Реакция на вопрос 4
        'ССЫЛКА_НА_ФОТО_9',  // Вопрос 5
        'ССЫЛКА_НА_ФОТО_10', // Реакция на вопрос 5
        'https://static.tildacdn.com/tild3830-3666-4630-b835-396262626336/2023-05-22_23-54-09.JPG'  // Финальный экран
    ];
    // ================================================================
    
    const questions = [
        {
            text: "Какого цвета у этой красивой девушки?",
            options: [
                { text: "Голубые", reaction: "Точно! Они правда самые красивые. 😉" },
                { text: "Карие", reaction: "Хитрость засчитана! Хотя на самом деле они правда самые красивые." },
                { text: "Зелёные", reaction: "Хитрость засчитана! Хотя на самом деле они правда самые красивые." },
                { text: "Самые красивые", reaction: "Хитрость засчитана! Хотя на самом деле они правда самые красивые." }
            ]
        },
        {
            text: "Где было наше первое свидание?",
            options: [
                { text: "Заельцовский парк", reaction: "Я до сих пор помню, как волновался.😊" },
                { text: "Сыроварня", reaction: "Я до сих пор помню, как волновался.😊" },
                { text: "В кино", reaction: "Я до сих пор помню, как волновался.😊" }
            ]
        },
        {
            text: "Как думаешь, какая твоя черта самая притягательная?",
            options: [
                { text: "Чувство юмора", reaction: "В тебе все прекрасно, но твоя улыбка - чтото особенное" },
                { text: "Ум", reaction: "В тебе все прекрасно, но твоя улыбка - чтото особенное" },
                { text: "Доброта", reaction: "В тебе все прекрасно, но твоя улыбка - чтото особенное" },
                { text: "Твоя улыбка", reaction: "В тебе все прекрасно, но твоя улыбка - чтото особенное" }
            ]
        },
        {
            text: "Если бы я был волшебником, что бы ты попросила прямо сейчас?",
            options: [
                { text: "Цветы", reaction: "Уже заказал. Как вернёшься — они тебя ждут 🌷" },
                { text: "Хорошую музыку", reaction: "Скину тебе плейлист, который специально собирал. Говорят, под него хочется улыбаться" },
                { text: "Чтобы день длился дольше", reaction: "Приезжай скорее, устроим романтический ужин 😊" },
                { text: "Сюрприз", reaction: "А вот это уже интересно. Значит, придётся что-то придумать... Жди" }
            ]
        },
        {
            text: "Сколько комплиментов ты готова получать в день?",
            options: [
                { text: "5", reaction: "Скромничаешь? Ладно, начнём с этого, а там посмотрим" },
                { text: "10", reaction: "Скромничаешь? Ладно, начнём с этого, а там посмотрим" },
                { text: "15", reaction: "Скромничаешь? Ладно, начнём с этого, а там посмотрим" },
                { text: "Бесконечность", reaction: "Мудрый выбор. Придётся мне потренироваться 😄" }
            ]
        }
    ];

    let currentStep = 0;
    let userAnswers = [];

    function renderQuestion() {
        const q = questions[currentStep];
        document.getElementById('question-text').innerText = q.text;
        
        // ФОТО ДЛЯ ВОПРОСА (используем четные индексы: 0,2,4,6,8)
        const photoIndex = currentStep * 2; // 0,2,4,6,8
        const photoRow = document.getElementById('photo-row');
        photoRow.innerHTML = `
            <div class="photo-container">
                <img src="${PHOTO_URLS[photoIndex]}" alt="фото">
            </div>
        `;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt.text;
            btn.onclick = () => handleAnswer(opt.reaction, opt.text);
            container.appendChild(btn);
        });
    }

    function handleAnswer(reaction, answerText) {
        userAnswers.push(answerText);
        
        // ФОТО ДЛЯ РЕАКЦИИ (используем нечетные индексы: 1,3,5,7,9)
        const photoIndex = currentStep * 2 + 1; // 1,3,5,7,9
        const reactionPhotoContainer = document.getElementById('reaction-photo-container');
        reactionPhotoContainer.innerHTML = `
            <div class="photo-container">
                <img src="${PHOTO_URLS[photoIndex]}" alt="фото">
            </div>
        `;
        
        document.getElementById('reaction-message').innerText = reaction;
        document.getElementById('reaction-modal').classList.add('active');
    }

    function nextQuestion() {
        document.getElementById('reaction-modal').classList.remove('active');
        currentStep++;
        if (currentStep < questions.length) {
            renderQuestion();
        } else {
            showFinal();
        }
    }

    function showFinal() {
        document.getElementById('quiz-container').classList.add('hidden');
        document.getElementById('final-container').classList.remove('hidden');
        
        // ФОТО ДЛЯ ФИНАЛА (индекс 10)
        document.getElementById('final-photo').src = PHOTO_URLS[10];
        
        launchConfetti();
    }

    function finishQuiz() {
        launchConfetti();
        launchConfetti();
        document.getElementById('bonus-message').classList.remove('hidden');
        sendToTelegram();
    }

    function launchConfetti() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#ff4d6d', '#ffccd5', '#ffffff']
        });
    }

    async function sendToTelegram() {
        if(TELEGRAM_BOT_TOKEN === 'ТВОЙ_ТОКЕН_БОТА') {
            console.log("Токен не настроен!");
            return; 
        }

        const message = `🌸 Девушка прошла квест!\n\nОтветы:\n${userAnswers.join('\n')}`;
        
        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message
                })
            });
        } catch (e) {
            console.log("Ошибка отправки", e);
        }
    }

    renderQuestion();

</script>

</body>
</html>
